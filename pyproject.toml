[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hose-history"
version = "0.1.0"
description = "Auditable free-source historical HOSE market data collector"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "pandas>=2.2,<4", "pyarrow>=19", "pdfplumber>=0.11,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-httpx>=0.35"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
collect-hose = "hose_history.cli:main"

[tool.setuptools.packages.find]
include = ["hose_history*"]

[tool.setuptools.package-data]
hose_history = ["resources/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: opt-in live provider network tests"]
addopts = "-m 'not integration'"
